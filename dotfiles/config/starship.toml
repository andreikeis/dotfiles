"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
command_timeout = 500

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nix_shell\
$aws\
$cmd_duration\
$character"""

[username]
style_user = "bold yellow"
format = "[$user]($style)@"
show_always = false

[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "bold green"

[directory]
style = "bold cyan"
truncation_length = 4
truncate_to_repo = true

[git_branch]
style = "bold purple"
format = " [$symbol$branch]($style)"

[git_status]
style = "bold red"
format = "[$all_status$ahead_behind]($style)"

[nix_shell]
symbol = " "
format = " [$symbol$state]($style)"
style = "bold blue"

[aws]
symbol = " "
format = " [$symbol$profile(\\($region\\))]($style)"
style = "bold yellow"
disabled = false

[cmd_duration]
min_time = 2000
format = " [$duration]($style)"
style = "yellow"

[character]
format = " $symbol "
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
