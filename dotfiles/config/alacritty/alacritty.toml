# --- Mouse: right-click pastes, selection auto-copies to clipboard
# (matches Linux-style select-to-copy + right-click-paste; tmux's own
# mouse bindings in tmux.conf take over once inside a tmux session)
[mouse]
bindings = [
  { mouse = "Right", action = "Paste" },
]

[selection]
save_to_clipboard = true

# --- Font: JetBrains Mono Nerd Font (installed via `nix profile install
# nixpkgs#nerd-fonts.jetbrains-mono`, symlinked into ~/Library/Fonts).
# The "Mono" variant keeps patched icon glyphs at the same fixed width
# as the rest of the font, so nerd-font icons in prompts/tmux don't
# throw off terminal column alignment.
[font]
size = 14.0

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold Italic"

# --- Solarized Dark (Ethan Schoonover's canonical palette)
[colors.primary]
background = "#002b36"
foreground = "#839496"
dim_foreground = "#657b83"
bright_foreground = "#93a1a1"

[colors.cursor]
text = "#002b36"
cursor = "#839496"

[colors.selection]
text = "#93a1a1"
background = "#073642"

[colors.normal]
black = "#073642"
red = "#dc322f"
green = "#859900"
yellow = "#b58900"
blue = "#268bd2"
magenta = "#d33682"
cyan = "#2aa198"
