# --- General ---
set-option -g prefix C-a
bind-key C-a last-window
bind-key a send-prefix
set -g base-index 1
setw -g pane-base-index 1
set -s escape-time 0
setw -g aggressive-resize on
set -g mouse on
set -g history-limit 50000
set -g renumber-windows on
set -g focus-events on

# --- Terminal / color ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,tmux-256color:RGB"

# --- Splits / navigation (keep current pane's cwd) ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Copy mode (vi keys, OS-aware clipboard) ---
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
if-shell "uname | grep -q Darwin" \
  "set -g @copy_cmd 'pbcopy'" \
  "set -g @copy_cmd 'xclip -selection clipboard -in'"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@copy_cmd}"

# --- Status bar ---
set -g status-interval 5
set -g status-style bg=default,fg=colour245
set -g status-left "#[fg=colour39,bold] #S #[fg=colour240]| "
set -g status-left-length 30
set -g status-right "#[fg=colour240]%Y-%m-%d #[fg=colour39]%H:%M "
setw -g window-status-current-style bg=colour239,fg=colour255,bold
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

# --- Reload ---
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
