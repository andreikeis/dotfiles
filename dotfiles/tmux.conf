# --- General ---
set-option -g prefix C-a
bind-key C-a last-window
# C-a a sends C-a through to the app -- including a nested (remote) tmux,
# so "C-a a c" creates a window in the inner session.
bind-key a send-prefix
set -g base-index 1
setw -g pane-base-index 1
set -s escape-time 0
setw -g aggressive-resize on
set -g history-limit 50000
set -g renumber-windows on
set -g focus-events on

# --- Terminal / color ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,tmux-256color:RGB,alacritty:RGB"

# --- Splits / navigation (keep current pane's cwd) ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Clipboard: OSC 52. Copies go to the outer terminal's clipboard via an
# escape sequence, so yanking inside a remote tmux lands in the Mac
# clipboard (remote tmux -> local tmux -> Alacritty). "on" (not the default
# "external") also lets a nested tmux's OSC 52 pass through this one.
set -s set-clipboard on
set -as terminal-features ",xterm-256color:clipboard,tmux-256color:clipboard,alacritty:clipboard"
if-shell "uname | grep -q Darwin" "set -s copy-command 'pbcopy'"

# --- Copy mode (vi keys) ---
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# --- Mouse: click-drag select copies on release, double/triple-click
# select word/line and copy immediately, right-click pastes. Matches
# normal terminal (xterm/Linux) mouse behavior.
set -g mouse on
bind-key -T root MouseDown1Pane select-pane -t = \; send-keys -M
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind-key -n DoubleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel
bind-key -n TripleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel
bind-key -n MouseDown3Pane select-pane \; paste-buffer

# --- Status bar (Solarized Dark) ---
# @accent: blue at home, orange on remote hosts (see below).
set -g @accent "#268bd2"
set -g @host_label ""
set -g status-interval 5
set -g status-style "bg=#073642,fg=#839496"
set -g status-left "#[fg=#002b36,bg=#{@accent},bold]#{?@host_label, ☁ #{@host_label} ·,} #S #[default] "
set -g status-left-length 40
set -g status-right "#{?#{==:#{key-table},off},#[fg=#002b36#,bg=#b58900#,bold] NESTED: keys -> inner tmux (F12) #[default] ,}#[fg=#586e75]%Y-%m-%d #[fg=#{@accent}]%H:%M "
set -g status-right-length 60
setw -g window-status-current-style "bg=#{@accent},fg=#002b36,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-active-border-style "fg=#{@accent}"
set -g pane-border-style "fg=#073642"
set -g message-style "bg=#{@accent},fg=#002b36"

# Terminal/window title. For the local tmux this is the Alacritty title; for a
# remote tmux it becomes the pane title in the local tmux, which the
# automatic-rename-format below shows as the window name.
set -g set-titles on
set -g set-titles-string "#{?@host_label,☁ #{@host_label}:#S,#S:#W}"
setw -g automatic-rename-format "#{?#{m/r:^(ssh|mosh-client|aws|session-manager-plugin)$,#{pane_current_command}},#{pane_title},#{pane_current_command}}"

# --- Remote host: orange accent, status bar on top. When nested, the remote
# bar sits at the top of the pane and the local bar at the bottom of the
# window, so it's always clear which is which. DEVBOX_LABEL is exported by
# zshrc/bashrc on SSH/EC2 hosts.
if-shell '[ -n "$DEVBOX_LABEL" ]' {
  set -g @accent "#cb4b16"
  set -g @host_label "$DEVBOX_LABEL"
  set -g status-position top
}

# --- Nested tmux: F12 turns this (outer) tmux "off" so every key, the prefix
# and the mouse go straight through to the inner (remote) tmux. The outer
# status bar dims and shows a NESTED marker; F12 again turns it back on.
# For one-off commands, "C-a a <key>" works without toggling.
bind -T root F12 \
  set prefix None \; \
  set key-table off \; \
  set mouse off \; \
  set @accent "#586e75" \; \
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \; \
  refresh-client -S
bind -T off F12 \
  set -u prefix \; \
  set -u key-table \; \
  set -u mouse \; \
  set -u @accent \; \
  refresh-client -S

# --- Reload ---
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
